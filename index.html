<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudMirror</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('cm-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
:root{
  color-scheme: light;
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f7f8fc; --ink:#0d1222; --muted:#5d667a; --faint:#8b94a7; --line:#e4e8f0;
  --accent:#4a5cf5; --accent-2:#7c5cf5; --accent-soft:color-mix(in oklab, var(--accent) 9%, var(--surface));
  --ok:#0b7f4d; --ok-bg:#e1f5eb; --warn:#935300; --warn-bg:#fff0d3; --bad:#bd3329; --bad-bg:#fde8e5;
  --tile:#ffffff; --fold:#f2a93b;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 10px 30px -14px rgba(15,23,42,.16);
  --shadow-lg:0 24px 60px -20px rgba(15,23,42,.35);
  --r:20px;
}
@media all{
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#090b12; --surface:#131723; --surface-2:#191e2c; --ink:#edf0f7; --muted:#9aa3b8; --faint:#6f7890; --line:#252b3c;
    --accent:#7b88ff; --accent-2:#a083ff; --accent-soft:color-mix(in oklab, var(--accent) 14%, var(--surface));
    --ok:#6fdba5; --ok-bg:#143325; --warn:#f2c25f; --warn-bg:#392d12; --bad:#ff948b; --bad-bg:#3f1f1d;
    --tile:#eef1f8; --fold:#e8a33c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:15px/1.5 "Inter var",Inter,system-ui,-apple-system,"Segoe UI Variable","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em;
  background:
    radial-gradient(900px 420px at 8% -8%, color-mix(in oklab, var(--accent) 13%, transparent), transparent 70%),
    radial-gradient(800px 380px at 96% -12%, color-mix(in oklab, var(--accent-2) 11%, transparent), transparent 70%),
    var(--bg);
  background-attachment:fixed;min-height:100vh}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;letter-spacing:-.02em}
b{font-weight:650}
.ico{width:18px;height:18px;flex:none;vertical-align:-3.5px}
.ico.fill{fill:currentColor;stroke:none}
.sp{flex:1}
.muted{color:var(--muted)} .ok{color:var(--ok)} .warn{color:var(--warn)}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,32px);position:sticky;top:0;z-index:20;
  background:color-mix(in oklab, var(--bg) 72%, transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);
  border-bottom:1px solid color-mix(in oklab, var(--line) 70%, transparent)}
.brandmark{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.brandmark img{width:30px;height:30px;display:block}
.chip{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.chip:empty{display:none}

/* buttons */
.btn{font:inherit;font-weight:560;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:9px 16px;border-radius:12px;cursor:pointer;transition:transform .12s, box-shadow .15s, border-color .15s, background .15s;box-shadow:0 1px 1px rgba(15,23,42,.03)}
.btn:hover{border-color:color-mix(in oklab, var(--ink) 25%, var(--line))}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 18px -8px color-mix(in oklab, var(--accent) 80%, transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.quiet:hover{background:var(--surface);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.tiny{padding:3px 10px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.danger:hover{background:var(--bad-bg);color:var(--bad)}
.icon-btn:disabled{opacity:.4;pointer-events:none}
.link{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
.link.tiny{font-size:13px}

/* layout */
.layout{max-width:1240px;margin:0 auto;padding:26px clamp(16px,3vw,32px) 90px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:26px;align-items:start}
aside{display:grid;gap:18px;position:sticky;top:84px}
@media (max-width:960px){.layout{grid-template-columns:1fr}aside{position:static}main{order:-1}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.panel-h h2{font-size:14px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex:1}
.hint{color:var(--muted);margin:0 0 14px;font-size:14px}

/* brand tile */
.brand{--s:36px;width:var(--s);height:var(--s);flex:none;display:inline-grid;place-items:center;border-radius:calc(var(--s)*.3);background:var(--tile);border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.06)}
.brand svg{width:64%;height:64%;display:block}
.brand.full{background:none;border:0;box-shadow:none}
.brand.full svg{width:100%;height:100%}

/* accounts */
.accts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.acct{display:flex;align-items:center;gap:11px;padding:9px 8px 9px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:border-color .15s, background .15s}
.acct.is-main{background:var(--accent-soft);border-color:color-mix(in oklab, var(--accent) 38%, var(--line))}
.a-t{flex:1;min-width:0}
.a-n{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-s{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.main{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.pill.main .ico{width:12px;height:12px;vertical-align:-1px}
.pill.new{background:var(--ok-bg);color:var(--ok);font-size:11px;padding:1px 7px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:620;padding:3px 10px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag.info{background:var(--accent-soft);color:var(--accent)}

/* safety options */
.opt{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:13px;cursor:pointer;margin-bottom:8px;transition:border-color .15s, background .15s}
.opt:last-child{margin-bottom:0}
.opt:hover{border-color:color-mix(in oklab, var(--ink) 22%, var(--line))}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt b{display:block;font-size:14.5px} .opt small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
.opt:has(input:checked){border-color:color-mix(in oklab, var(--accent) 45%, var(--line));background:var(--accent-soft)}

/* page header */
.page-h{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:28px;font-weight:720}
.page-h .sub{margin:4px 0 0;color:var(--muted);max-width:56ch}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}

/* banner */
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:16px;margin-bottom:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.banner.run{border-color:color-mix(in oklab, var(--accent) 40%, var(--line));background:var(--accent-soft)}
.banner.bad{border-color:color-mix(in oklab, var(--bad) 40%, var(--line))}
.banner b{font-size:15.5px}
.banner .sub{color:var(--muted);font-size:14px}

/* plan cards */
.plans{display:grid;gap:16px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.plan-h{display:flex;align-items:center;gap:14px;padding:16px 18px}
.plan-src{flex:1;min-width:0}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px 5px;font-size:16px}
.crumbs span{color:var(--muted)} .crumbs i{font-style:normal;color:var(--faint)} .crumbs b{font-weight:680}
.sub{color:var(--muted);font-size:13.5px}
.plan-actions{display:flex;gap:4px;align-items:center}
.dests{border-top:1px solid var(--line);background:var(--surface-2)}
.dest{padding:13px 18px;border-bottom:1px solid var(--line)}
.dest:last-child{border-bottom:0}
.dest-row{display:flex;align-items:center;gap:13px}
.dest-row .join{color:var(--faint);display:grid;place-items:center;width:18px}
.d-main{flex:1;min-width:0}
.d-name{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:15px}
.d-name .crumbs{font-size:14.5px}
.progress{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin:11px 0 6px}
.progress i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s}
.counts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
details{margin-top:8px} summary{cursor:pointer;color:var(--accent);font-size:14px;width:max-content}
.files{font:12.5px/1.6 ui-monospace,"Cascadia Code",Consolas,monospace;max-height:230px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:7px;white-space:pre-wrap;word-break:break-all}
.files .a{color:var(--ok)} .files .u{color:var(--warn)} .files .r{color:var(--bad)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:11px;padding:9px 12px;margin-top:9px;font-size:14px;word-break:break-word}

.empty{text-align:center;padding:54px 24px;background:var(--surface);border:1px dashed color-mix(in oklab, var(--ink) 18%, var(--line));border-radius:var(--r)}
.empty img{width:76px;height:76px;margin-bottom:10px}
.empty h3{font-size:19px;margin-bottom:6px} .empty p{color:var(--muted);max-width:46ch;margin:0 auto 18px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(8,10,18,.55);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
.sheet{width:min(680px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
.sheet.narrow{width:min(520px,100%)}
.sheet-h{padding:20px 24px 0;display:flex;align-items:center;gap:12px}
.sheet-h h3{font-size:19px}
.sheet-b{padding:16px 24px;overflow:auto;flex:1;min-height:0}
.sheet-b h3{font-size:19px;margin-bottom:4px}
.sheet-f{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:14px 24px 20px;border-top:1px solid var(--line)}
.sheet-f .sel{flex:1;min-width:0;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.steps{list-style:none;display:flex;gap:8px;padding:0;margin:0}
.steps li{font-size:13px;font-weight:620;color:var(--faint);display:flex;align-items:center;gap:7px}
.steps li::before{content:attr(data-n);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:12px}
.steps li+li::after{content:"";}
.steps li.on{color:var(--ink)} .steps li.on::before{background:var(--accent);border-color:var(--accent);color:#fff}
.steps li.done{color:var(--muted)} .steps li.done::before{content:"✓";background:var(--ok-bg);color:var(--ok);border-color:transparent}
.steps li:not(:last-child)::after{content:"";width:28px;height:2px;background:var(--line);border-radius:2px;margin-left:3px}

.flabel{display:block;font-size:13px;font-weight:620;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=password],select{font:inherit;width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);transition:border-color .15s, box-shadow .15s}
input[type=text]:focus,input[type=password]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab, var(--accent) 18%, transparent)}
.help{white-space:pre-wrap;color:var(--muted);font-size:14px;margin:0 0 14px;word-break:break-word}
.help a{color:var(--accent)}
.optlist{display:grid;gap:8px;margin-bottom:14px}
.optlist label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 13px;cursor:pointer}
.optlist label:has(input:checked){border-color:color-mix(in oklab, var(--accent) 45%, var(--line));background:var(--accent-soft)}
.optlist input{accent-color:var(--accent)}
.provgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.prov{font:inherit;display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px 13px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;font-weight:580;font-size:14px;transition:transform .12s, border-color .15s, box-shadow .15s}
.prov:hover{border-color:color-mix(in oklab, var(--accent) 50%, var(--line));box-shadow:var(--shadow);transform:translateY(-2px)}
@media (max-width:520px){.provgrid{grid-template-columns:repeat(2,1fr)}}

/* folder tree */
.tree{border:1px solid var(--line);border-radius:16px;background:var(--surface-2);padding:8px;max-height:min(44vh,420px);overflow:auto}
.tree ul{list-style:none;margin:0;padding:0 0 0 20px;border-left:1px solid color-mix(in oklab, var(--line) 80%, transparent);margin-left:17px}
.tree>ul{padding-left:0;margin-left:0;border:0}
.tree-root{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;font-weight:650}
.node{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:11px;cursor:pointer;transition:background .12s}
.node:hover{background:color-mix(in oklab, var(--accent) 7%, transparent)}
.node.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px color-mix(in oklab, var(--accent) 55%, transparent)}
.chev{width:22px;height:22px;display:grid;place-items:center;border:0;background:none;color:var(--faint);cursor:pointer;border-radius:7px;flex:none;padding:0}
.chev:hover{background:var(--line);color:var(--ink)} .chev.none{pointer-events:none}
.chev .ico{width:15px;height:15px;transition:transform .15s} .chev.open .ico{transform:rotate(90deg)}
.node .fold{color:var(--fold);fill:color-mix(in oklab, var(--fold) 28%, transparent)}
.node .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ns{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tree-note{color:var(--muted);font-size:13.5px;padding:6px 10px 6px 34px}
.tools{display:flex;gap:8px;margin:12px 0 10px;align-items:center;flex-wrap:wrap}
.newrow{display:flex;gap:8px;margin-bottom:10px}

/* destination cards */
.src-chip{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2);margin:6px 0 20px}
.src-chip .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
.src-chip .crumbs{font-size:15.5px}
.dcard{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;transition:border-color .15s, background .15s}
.dcard.on{border-color:color-mix(in oklab, var(--accent) 45%, var(--line));background:var(--accent-soft)}
.dhead{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.dhead input{position:absolute;opacity:0;pointer-events:none}
.sw{width:38px;height:22px;border-radius:99px;background:color-mix(in oklab, var(--ink) 16%, var(--surface));position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.dhead input:checked+.sw{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.dhead input:checked+.sw::after{transform:translateX(16px)}
.dhead input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.dn{display:flex;flex-direction:column;line-height:1.25} .dn small{color:var(--muted);font-size:13px}
.dbody{padding:0 14px 14px 64px}
@media (max-width:520px){.dbody{padding-left:14px}}
.pathrow{display:flex;gap:8px;align-items:center}
.pathrow .pfx{color:var(--muted);font-size:14px;white-space:nowrap;max-width:34%;overflow:hidden;text-overflow:ellipsis}
.dinfo{font-size:13.5px;margin-top:8px;min-height:20px}

.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .75s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;box-shadow:var(--shadow-lg);z-index:80;max-width:min(560px,92vw);font-size:14.5px;animation:pop .2s}
.hero{max-width:520px;margin:12vh auto 0;text-align:center;padding:0 16px}
.hero img{width:96px;height:96px}
.hero h1{font-size:30px;margin:14px 0 8px}
.hero p{color:var(--muted);margin:0 0 22px}
[hidden]{display:none!important}
.chip.upd{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in oklab, var(--accent) 35%, var(--line));text-decoration:none;cursor:pointer}
.btn.danger{border-color:transparent;background:var(--bad);color:#fff}
.btn.danger:hover{filter:brightness(1.08)}
.check{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14.5px;margin:14px 0 4px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.panel .flabel{margin-top:2px}
.panel .btn.wide{margin-top:12px}
.note{background:var(--accent-soft);border:1px solid color-mix(in oklab, var(--accent) 25%, var(--line));border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.note ol{margin:8px 0 0;padding-left:20px} .note a,.hint a{color:var(--accent)}
code{font:12.5px ui-monospace,"Cascadia Code",Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
textarea{font:13.5px/1.5 ui-monospace,"Cascadia Code",Consolas,monospace;width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab, var(--accent) 18%, transparent)}
.skip{margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:4px 14px 14px}
.skip summary{padding:10px 0;font-weight:600;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip-btn{font:inherit;font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
.trow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border:0} .trow .sub{margin-top:1px}
.hentry{border:1px solid var(--line);border-radius:16px;margin:0 0 10px;padding:0 14px;background:var(--surface)}
.hentry>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;width:100%;color:var(--ink)}
.hentry[open]>summary{border-bottom:1px solid var(--line);margin-bottom:6px}
.hpair{padding:8px 0 10px;border-bottom:1px dashed var(--line)} .hpair:last-child{border:0}
.empty-sm{text-align:center;color:var(--muted);padding:34px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brandmark"><img src="/icon.svg" alt="" width="30" height="30"><span>CloudMirror</span><span class="chip" id="ver"></span><a class="chip upd" id="upd" hidden target="_blank" rel="noopener"></a></div>
  <span class="sp"></span>
  <button class="icon-btn" id="theme" data-act="theme" type="button"></button>
  <button class="btn quiet small" data-act="quit">Quit</button>
</header>
<div id="root"></div>
<div id="modal"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;

/* ---------- icons ---------- */
const P = {
  plus:'M12 5v14M5 12h14', x:'M6 6l12 12M18 6L6 18', chev:'M9 6l6 6-6 6',
  pencil:'M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19zM14 7l3 3',
  trash:'M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3',
  folder:'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  folderplus:'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10v5M9.5 12.5h5',
  arrow:'M5 12h14M13 6l6 6-6 6', check:'M5 12.5l4.5 4.5L19 7', search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.5-4.5',
  star:'M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z',
  stop:'M7 7h10v10H7z', sync:'M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3M18 3v4h-4M6 21v-4h4',
  down:'M12 4v11M7 11l5 5 5-5M5 20h14',
  clock:'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',
  sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
  moon:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z'
};
const ico = (n, c = '') => `<svg class="ico ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;

const FULL = new Set(['koofr', 'filen', 'box', 'mega', 'protondrive']);
const BRAND = {
  drive:`<svg viewBox="0 0 87.3 78"><path d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="M43.65 25L29.9 1.2c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0-1.2 4.5h27.5z" fill="#00ac47"/><path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/><path d="M43.65 25L57.4 1.2c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="M59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="M73.4 26.5l-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25 59.8 53h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>`,
  pcloud:`<svg viewBox="5 7 40 33"><g fill="#17bed0"><circle cx="16" cy="29" r="8"/><circle cx="26" cy="21" r="11"/><circle cx="36" cy="29" r="7.5"/><rect x="16" y="29" width="20" height="8"/></g><rect x="21" y="19" width="3.4" height="17" rx="1.7" fill="#fff"/><circle cx="28" cy="25" r="4.6" fill="none" stroke="#fff" stroke-width="3.2"/></svg>`,
  koofr:`<svg viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="12" fill="#2fb457"/><path d="M18 14v20M18.5 25.5L30 14M21 23.5L31 34" stroke="#fff" stroke-width="4.2" stroke-linecap="round" fill="none"/></svg>`,
  filen:`<svg viewBox="0 0 48 48"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f80ff"/><stop offset="1" stop-color="#6b4cf0"/></linearGradient></defs><rect x="3" y="3" width="42" height="42" rx="12" fill="url(#fg)"/><path d="M18 35V14h13M18 24.5h9.5" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`,
  dropbox:`<svg viewBox="0 0 48 48" fill="#0061ff"><path d="M14 8l10 6.5L14 21 4 14.5zM34 8l10 6.5L34 21l-10-6.5zM14 22l10 6.5L14 35 4 28.5zM34 22l10 6.5L34 35l-10-6.5zM14 37l10-6.5L34 37l-10 6.5z"/></svg>`,
  onedrive:`<svg viewBox="3 7 42 33"><g fill="#0364b8"><circle cx="14" cy="28" r="8"/><circle cx="22" cy="20" r="10"/><rect x="14" y="28" width="16" height="8"/></g><g fill="#28a8ea"><circle cx="35" cy="28" r="7"/><rect x="26" y="28" width="9" height="7"/></g><circle cx="30" cy="25" r="6" fill="#0f7fd9"/></svg>`,
  mega:`<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#d9272e"/><path d="M14 33V17.5l10 10.5 10-10.5V33" stroke="#fff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`,
  box:`<svg viewBox="0 0 48 48"><rect x="2" y="9" width="44" height="30" rx="8" fill="#0061d5"/><text x="24" y="30.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="16.5" fill="#fff">box</text></svg>`,
  protondrive:`<svg viewBox="0 0 48 48"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6bff"/><stop offset="1" stop-color="#5a38e8"/></linearGradient></defs><rect x="3" y="3" width="42" height="42" rx="12" fill="url(#pg)"/><path d="M12 17a2 2 0 0 1 2-2h6l3 3h11a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2z" fill="#fff"/></svg>`,
  alias:`<svg viewBox="0 0 48 48"><path d="M6 14a3 3 0 0 1 3-3h10l4 5h16a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z" fill="#f2a93b"/></svg>`,
  _:`<svg viewBox="0 0 48 48"><g fill="#8a94a8"><circle cx="16" cy="29" r="8"/><circle cx="26" cy="21" r="11"/><circle cx="36" cy="29" r="7.5"/><rect x="16" y="29" width="20" height="8"/></g></svg>`
};
const SERVICE = {drive:'Google Drive', pcloud:'pCloud', koofr:'Koofr', filen:'Filen', dropbox:'Dropbox', onedrive:'OneDrive', mega:'MEGA',
  box:'Box', protondrive:'Proton Drive', s3:'S3-compatible', webdav:'WebDAV', sftp:'SFTP', alias:'Local folder'};
const POPULAR = ['drive','pcloud','koofr','filen','dropbox','onedrive','mega','box','protondrive'];
const svc = t => SERVICE[t] || t;
const brand = (t, s = 36) => `<span class="brand ${FULL.has(t) ? 'full' : ''}" style="--s:${s}px" title="${esc(svc(t))}">${BRAND[t] || BRAND._}</span>`;

/* ---------- state ---------- */
let S = null, W = null, TR = null, overlay = null, hiddenJob = '';
const sizes = {}, openKeys = new Set();
const typeOf = n => (S.remotes.find(r => r.name === n) || {}).type || '';
const isRunning = () => !!(S.job && S.job.running);
const cleanPath = p => String(p || '').replace(/\\/g, '/').split('/').map(s => s.trim()).filter(Boolean).join('/');
const parentOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const join = (p, n) => p ? p + '/' + n : n;

async function api(path, data) {
  const r = await fetch('/api/' + path, data === undefined ? {} :
    {method:'POST', headers:{'Content-Type':'application/json','X-CloudMirror':'1'}, body: JSON.stringify(data)});
  const j = await r.json().catch(() => ({error:'Unexpected reply from the app'}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}
function fmtBytes(b) {
  const u = ['B','KB','MB','GB','TB','PB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i === 0 ? b : b.toFixed(b < 10 ? 2 : b < 100 ? 1 : 0)) + ' ' + u[i];
}
const fmtN = n => n.toLocaleString();
const files = n => fmtN(n) + (n === 1 ? ' file' : ' files');
const fmtETA = s => s == null ? '' : s < 60 ? Math.round(s) + ' s left' : s < 3600 ? Math.round(s / 60) + ' min left' : (s / 3600).toFixed(1) + ' h left';
const crumbs = p => `<span class="crumbs">${p.split('/').map((s, i, a) => i === a.length - 1 ? `<b>${esc(s)}</b>` : `<span>${esc(s)}</span><i>›</i>`).join('')}</span>`;
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 4500);
}

const sizeKey = (remote, path, pl) => `${remote}:${path}|${S.settings.gdocs}|${pl && pl.exclude ? pl.exclude.join('\n') : ''}`;
function dropSizes(base) { for (const k of Object.keys(sizes)) if (k.startsWith(base + '|')) delete sizes[k]; }
function wantSize(remote, path, pl) {
  const k = sizeKey(remote, path, pl);
  if (sizes[k]) return sizes[k];
  sizes[k] = 'loading';
  api('size?remote=' + enc(remote) + '&path=' + enc(path) + (pl && pl.exclude && pl.exclude.length ? '&plan=' + pl.id : ''))
    .then(v => { sizes[k] = v; }).catch(e => { sizes[k] = {error: e.message}; })
    .finally(() => { render(); if (overlay) overlay(); });
  return 'loading';
}
function sizeText(v) {
  if (v === 'loading') return '<span class="spin"></span> counting…';
  if (v.error) return `<span title="${esc(v.error)}">size unavailable</span>`;
  if (v.missing) return 'not created yet';
  return `${fmtBytes(v.bytes)} · ${files(v.count)}`;
}

/* ---------- theme ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = $('#theme'); if (!b) return;
  b.innerHTML = ico(t === 'dark' ? 'sun' : 'moon');
  const label = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
  b.title = label; b.setAttribute('aria-label', label);
}
function storedTheme() { try { return localStorage.getItem('cm-theme'); } catch (e) { return null; } }
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('cm-theme', next); } catch (e) {}
  applyTheme(next);
}
applyTheme(document.documentElement.dataset.theme);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { if (!storedTheme()) applyTheme(e.matches ? 'dark' : 'light'); });

/* ---------- load / poll ---------- */
async function load() {
  S = await api('state');
  $('#ver').textContent = S.app.version === 'dev' ? 'dev' : 'v' + S.app.version;
  render();
  if (isRunning()) poll();
  checkUpdate();
}
let polling = false;
async function poll() {
  if (polling) return; polling = true;
  try {
    while (true) {
      await new Promise(r => setTimeout(r, 700));
      const was = isRunning();
      S = await api('state');
      if (!isRunning()) {
        if (was && S.job) for (const p of S.job.pairs) { dropSizes(p.dest + ':' + p.destPath); dropSizes(S.settings.main + ':' + p.folder); }
        break;
      }
      render();
    }
  } finally { polling = false; render(); }
}

/* ---------- main render ---------- */
function render() {
  if (!S) return;
  const root = $('#root');
  if (!S.engine.found) { root.innerHTML = setupHTML(); return; }
  root.innerHTML = `<div class="layout"><aside>${sideHTML()}</aside><main>${mainHTML()}</main></div>`;
}
function setupHTML() {
  return `<div class="hero"><img src="/icon.svg" alt=""><h1>One quick setup</h1>
    <p>CloudMirror uses the free, open-source <b>rclone</b> engine to talk to your cloud services. It is downloaded once (about 25 MB) from rclone.org.</p>
    <button class="btn primary" data-act="install" id="install">${ico('down')} Download and continue</button><div id="msg"></div></div>`;
}

function sideHTML() {
  const main = S.settings.main, running = isRunning(), mode = S.settings.deleteMode;
  let h = `<section class="panel"><div class="panel-h"><h2>Accounts</h2><button class="icon-btn" data-act="add-acct" title="Add account" aria-label="Add account" ${running ? 'disabled' : ''}>${ico('plus')}</button></div>`;
  if (!S.remotes.length) {
    h += `<p class="hint">Connect the cloud services you use. You choose one as your <b>main</b> — the one you upload to.</p>
      <button class="btn primary wide" data-act="add-acct">${ico('plus')} Add your first account</button>`;
  } else {
    h += `<ul class="accts">` + S.remotes.map(r => {
      const isMain = r.name === main;
      return `<li class="acct ${isMain ? 'is-main' : ''}">${brand(r.type, 38)}<div class="a-t"><div class="a-n">${esc(r.name)}</div><div class="a-s">${esc(svc(r.type))}</div></div>
        ${isMain ? `<span class="pill main">${ico('star', 'fill')} Main</span>` : `<button class="btn tiny" data-act="make-main" data-n="${esc(r.name)}" ${running ? 'disabled' : ''}>Make main</button>`}
        <button class="icon-btn danger" data-act="del-acct" data-n="${esc(r.name)}" title="Disconnect" aria-label="Disconnect ${esc(r.name)}" ${running ? 'disabled' : ''}>${ico('x')}</button></li>`;
    }).join('') + `</ul>`;
  }
  h += `</section>`;
  h += `<section class="panel"><div class="panel-h"><h2>If a file is removed or changed on ${main ? esc(main) : 'main'}</h2></div>
    ${[['trash', 'Keep the old copy in a trash folder', 'Safest. Removed and replaced files go to _SyncTrash on the destination.'],
       ['mirror', 'Delete it from the destination', 'Destination always matches exactly. No way back.'],
       ['keep', 'Leave the destination alone', 'Only add new and changed files, never remove.']].map(([v, t, d]) =>
      `<label class="opt"><input type="radio" name="dm" value="${v}" ${mode === v ? 'checked' : ''} ${running ? 'disabled' : ''}><span><b>${t}</b><small>${d}</small></span></label>`).join('')}
    </section>`;
  const hasDrive = S.remotes.some(r => r.type === 'drive');
  h += `<section class="panel"><div class="panel-h"><h2>Options</h2></div>`;
  if (hasDrive) {
    h += `<div class="flabel">Google Docs, Sheets and Slides</div>` + [
      ['skip', 'Skip them (recommended)', 'They aren’t real files, so copying them is slow and they can look “changed” on every run.'],
      ['export', 'Copy them as Office files', 'Saved as .docx, .xlsx and .pptx. Slower, and may be re-copied each time.']].map(([v, t, d]) =>
      `<label class="opt"><input type="radio" name="gd" value="${v}" ${S.settings.gdocs === v ? 'checked' : ''} ${running ? 'disabled' : ''}><span><b>${t}</b><small>${d}</small></span></label>`).join('');
  }
  h += `<label class="check"><input type="checkbox" name="upd" ${S.settings.noUpdateCheck ? '' : 'checked'}><span>Tell me when a new version is out</span></label>
    <button class="btn wide" data-act="trash" ${running ? 'disabled' : ''}>${ico('trash')} Clean up trash…</button></section>`;
  return h;
}

function jobVisible() { return S.job && S.job.started !== hiddenJob; }

function mainHTML() {
  const main = S.settings.main, plans = S.settings.plans, running = isRunning();
  const others = S.remotes.filter(r => r.name !== main);
  let h = `<div class="page-h"><div><h1>Sync plans</h1><p class="sub">${main
    ? `Each plan keeps a folder of <b>${esc(main)}</b> — or any sub-folder — identical in the places you choose.`
    : 'Choose a main account to begin.'}</p></div><div class="page-actions">`;
  h += `<button class="btn" data-act="history">${ico('clock')} History</button>`;
  if (plans.length) h += `<button class="btn" data-act="run" data-k="preview" ${running ? 'disabled' : ''}>${ico('search')} Check all</button>
      <button class="btn" data-act="run" data-k="sync" ${running ? 'disabled' : ''}>${ico('sync')} Sync all</button>`;
  h += `<button class="btn primary" data-act="new-plan" ${!main || !others.length || running ? 'disabled' : ''}>${ico('plus')} New sync</button></div></div>`;
  if (jobVisible()) h += bannerHTML();
  if (!plans.length) {
    h += `<div class="empty"><img src="/icon.svg" alt=""><h3>${!S.remotes.length ? 'Connect your first account' : !main ? 'Choose your main account' : others.length ? 'Create your first sync' : 'Add a second account'}</h3>
      <p>${!S.remotes.length ? 'Add Google Drive, pCloud, Koofr, Filen and more from the Accounts panel.'
        : !main ? 'Press “Make main” on the account you upload your files to.'
        : others.length ? 'Pick a folder on ' + esc(main) + ' — a whole folder or just a sub-folder — and choose where its copies should live.'
        : 'CloudMirror needs somewhere to copy to. Add another account in the Accounts panel.'}</p>
      ${main && others.length ? `<button class="btn primary" data-act="new-plan">${ico('plus')} New sync</button>` : ''}</div>`;
  } else h += `<div class="plans">${plans.map(planHTML).join('')}</div>`;
  return h;
}

function bannerHTML() {
  const j = S.job, prev = j.kind === 'preview', ps = j.pairs;
  const tot = ps.reduce((t, p) => t + p.nAdded + p.nUpdated + p.nRemoved, 0);
  const failed = ps.filter(p => p.status === 'error').length, stopped = ps.some(p => p.status === 'cancelled');
  let cls = '', title, sub = '', act = '';
  if (j.running) {
    cls = 'run'; title = `<span class="spin"></span> ${prev ? 'Checking for changes…' : 'Syncing…'}`;
    act = `<button class="btn small" data-act="stop">${ico('stop')} Stop</button>`;
  } else if (failed) { cls = 'bad'; title = `${prev ? 'Check' : 'Sync'} finished with problems in ${failed} ${failed === 1 ? 'copy' : 'copies'}`; }
  else if (stopped) title = 'Stopped';
  else if (prev) {
    title = tot ? `${fmtN(tot)} ${tot === 1 ? 'change' : 'changes'} waiting` : 'Everything is already up to date';
    sub = tot ? 'Nothing has been changed yet.' : '';
    if (tot) act = `<button class="btn primary small" data-act="apply">${ico('sync')} Apply these changes</button>`;
  } else title = tot ? `Sync complete — ${fmtN(tot)} ${tot === 1 ? 'change' : 'changes'} applied` : 'Sync complete — everything was already up to date';
  return `<div class="banner ${cls}"><div><b>${title}</b>${sub ? `<div class="sub">${sub}</div>` : ''}</div><span class="sp"></span>${act}
    ${j.running ? '' : `<button class="icon-btn" data-act="dismiss" title="Dismiss" aria-label="Dismiss">${ico('x')}</button>`}</div>`;
}

function planHTML(pl) {
  const main = S.settings.main, running = isRunning(), ms = wantSize(main, pl.source, pl);
  return `<section class="plan"><header class="plan-h">${brand(typeOf(main), 42)}
    <div class="plan-src">${crumbs(pl.source)}<div class="sub">${esc(main)} · ${sizeText(ms)}${pl.exclude && pl.exclude.length ? ` · <span title="${esc(pl.exclude.join(', '))}">skipping ${pl.exclude.length} ${pl.exclude.length === 1 ? 'pattern' : 'patterns'}</span>` : ''}</div></div>
    <div class="plan-actions">
      <button class="icon-btn" data-act="run" data-k="preview" data-id="${pl.id}" title="Check this one for changes" aria-label="Check for changes" ${running ? 'disabled' : ''}>${ico('search')}</button>
      <button class="icon-btn" data-act="run" data-k="sync" data-id="${pl.id}" title="Sync this one now" aria-label="Sync now" ${running ? 'disabled' : ''}>${ico('sync')}</button>
      <button class="icon-btn" data-act="edit-plan" data-id="${pl.id}" title="Edit" aria-label="Edit" ${running ? 'disabled' : ''}>${ico('pencil')}</button>
      <button class="icon-btn danger" data-act="del-plan" data-id="${pl.id}" title="Remove" aria-label="Remove" ${running ? 'disabled' : ''}>${ico('trash')}</button>
    </div></header>
    <div class="dests">${pl.targets.map(t => destRow(pl, t, ms)).join('')}</div></section>`;
}

function destRow(pl, t, ms) {
  const ds = wantSize(t.remote, t.path, pl);
  const pair = jobVisible() ? S.job.pairs.find(p => p.planId === pl.id && p.dest === t.remote && p.destPath === t.path) : null;
  let badge = '';
  if (ds !== 'loading' && ms !== 'loading' && !ds.error && !ms.error) {
    badge = ds.missing ? '<span class="tag mute">New</span>'
      : (ds.count === ms.count && ds.bytes === ms.bytes) ? `<span class="tag ok">${ico('check')} Matches</span>` : '<span class="tag warn">Differs</span>';
  }
  return `<div class="dest"><div class="dest-row"><span class="join">${ico('arrow')}</span>${brand(typeOf(t.remote), 32)}
    <div class="d-main"><div class="d-name"><b>${esc(t.remote)}</b>${crumbs(t.path)}</div><div class="sub">${sizeText(ds)}</div></div>${badge}
    ${pair ? statusTag(pair) : ''}</div>${pair ? pairDetail(pair) : ''}</div>`;
}
function statusTag(p) {
  const prev = S.job.kind === 'preview';
  const m = {pending:['mute','Waiting'], running:['info', prev ? 'Checking' : 'Syncing'], done:['ok', prev ? 'Checked' : 'Done'], error:['bad','Problem'], cancelled:['mute','Stopped']}[p.status];
  return `<span class="tag ${m[0]}">${m[1]}</span>`;
}

    <div class="sheet-b"><p class="hint">When a sync removes or replaces a file, the old version is kept in a <b>_SyncTrash</b> folder on the destination. Delete the old ones to free space. Your copies are not touched.</p>
    <label class="flabel">Delete trash older than</label>
    <select data-chg="trash-days" ${T.busy ? 'disabled' : ''}>${[[7, '7 days'], [14, '14 days'], [30, '30 days'], [90, '90 days'], [0, 'any age (everything)']].map(([v, l]) => `<option value="${v}" ${T.days === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <div style="margin-top:12px">${rows}</div></div>
    <div class="sheet-f"><div class="sel">${!T.busy && !T.done && old ? `Frees ${fmtBytes(bytes)} · ${files(nfiles)}` : ''}</div>
    <button class="btn" data-act="w-close">Close</button>
    ${T.done ? '' : `<button class="btn danger" data-act="trash-clean" ${T.busy || !old || isRunning() ? 'disabled' : ''}>Delete permanently</button>`}</div>`, 'narrow');
}
async function cleanTrash() {
  const T = TRASH, old = (T.res || []).reduce((n, r) => n + r.old, 0), bytes = (T.res || []).reduce((n, r) => n + r.bytes, 0);
  if (!confirm(`Permanently delete ${old} trash ${old === 1 ? 'snapshot' : 'snapshots'} (${fmtBytes(bytes)})? This can’t be undone.`)) return;
  T.busy = true; drawTrash();
  try { T.res = await api('trash/clean', {days: T.days}); T.done = true; } catch (e) { toast(e.message); }
  T.busy = false; drawTrash();
}

/* ---------- history ---------- */
function histEntry(e, i) {
  const prev = e.kind === 'preview', when = new Date(e.started).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'});
  const tot = e.pairs.reduce((n, p) => n + p.nAdded + p.nUpdated + p.nRemoved, 0), bad = e.pairs.filter(p => p.status === 'error').length;
  const sum = tot ? `${fmtN(tot)} ${tot === 1 ? 'change' : 'changes'} ${prev ? 'found' : 'applied'}` : 'no changes';
  const body = e.pairs.map(p => {
    const c = p.nAdded + p.nUpdated + p.nRemoved;
    return `<div class="hpair"><div class="d-name"><b>${esc(p.folder)}</b><span class="muted">→</span><b>${esc(p.dest)}</b>${crumbs(p.destPath)}
      <span class="tag ${p.status === 'error' ? 'bad' : p.status === 'done' ? 'ok' : 'mute'}">${p.status === 'error' ? 'Problem' : p.status === 'done' ? 'Done' : 'Stopped'}</span></div>
      ${c ? `<div class="counts"><span class="tag ok">${fmtN(p.nAdded)} ${prev ? 'to add' : 'added'}</span><span class="tag warn">${fmtN(p.nUpdated)} ${prev ? 'to update' : 'updated'}</span>${e.mode === 'keep' ? '' : `<span class="tag bad">${fmtN(p.nRemoved)} ${prev ? 'to remove' : 'removed'}</span>`}</div>
      <details><summary>Show files</summary><div class="files">${p.added.map(f => `<span class="a">+ ${esc(f)}</span>`).concat(p.updated.map(f => `<span class="u">~ ${esc(f)}</span>`), p.removed.map(f => `<span class="r">− ${esc(f)}</span>`)).join('\n')}${c > p.added.length + p.updated.length + p.removed.length ? '\n… and more' : ''}</div></details>` : '<div class="sub">No changes</div>'}
      ${p.errors.map(x => `<div class="err">${esc(x)}</div>`).join('')}</div>`;
  }).join('');
  return `<details class="hentry" ${i === 0 ? 'open' : ''}><summary><span class="tag ${prev ? 'mute' : 'info'}">${prev ? 'Check' : 'Sync'}</span><b>${esc(when)}</b><span class="sub">${sum}</span>${bad ? '<span class="tag bad">problems</span>' : ''}</summary>${body}</details>`;
}
async function openHistory() {
  sheet('<div class="sheet-b"><span class="spin"></span> Loading…</div>', 'narrow');
  let list;
  try { list = await api('history'); } catch (e) { closeSheet(); toast(e.message); return; }
  sheet(`<div class="sheet-h"><h3>History</h3><span class="sp"></span><button class="icon-btn" data-act="w-close" aria-label="Close">${ico('x')}</button></div>
    <div class="sheet-b">${list.length ? list.map(histEntry).join('') : '<div class="empty-sm">Nothing here yet. Every check and sync you run is listed here.</div>'}</div>
    <div class="sheet-f">${list.length ? '<button class="btn" data-act="history-clear">Clear history</button>' : ''}<span class="sp"></span><button class="btn" data-act="w-close">Close</button></div>`);
}

/* ---------- update notice ---------- */
async function checkUpdate() {
  const a = $('#upd');
  try { const u = await api('update'); if (u.newer) { a.hidden = false; a.href = u.url; a.textContent = 'Update available · v' + u.latest; } else a.hidden = true; }
  catch (e) { a.hidden = true; }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'install': {
      el.disabled = true; el.innerHTML = '<span class="spin"></span> Downloading…';
      try { await api('install', {}); await load(); }
      catch (er) { el.disabled = false; el.innerHTML = ico('down') + ' Try again'; $('#msg').innerHTML = `<div class="err" style="margin-top:14px">${esc(er.message)}</div>`; }
      break; }
    case 'theme': toggleTheme(); break;
    case 'history': openHistory(); break;
    case 'history-clear':
      if (!confirm('Clear the whole history? This only removes the list, not any files.')) return;
      await api('history/clear', {}).catch(er => toast(er.message)); openHistory(); break;
    case 'trash': openTrash(); break;
    case 'trash-clean': cleanTrash(); break;
    case 'ex-add': {
      const lines = W.exclude.split('\n').map(x => x.trim());
      if (!lines.includes(d.p)) W.exclude = (W.exclude.trim() ? W.exclude.replace(/\s+$/, '') + '\n' : '') + d.p;
      $('#exclude').value = W.exclude; break; }
    case 'quit':
      if (isRunning() && !confirm('A sync is running. Quit and stop it?')) return;
      await api('quit', {}).catch(() => {});
      document.body.innerHTML = '<div class="hero"><img src="/icon.svg" alt=""><h1>CloudMirror is closed</h1><p>You can close this tab.</p></div>'; break;
    case 'add-acct': addAccount(); break;
    case 'pick-prov': pickProv(d.t); break;
    case 'acct-go': acctStep({name: $('#pname').value.trim(), type: d.t, first: true}); break;
    case 'acct-next': {
      const a = $('#ans'), v = a ? a.value : ($('input[name=ans]:checked') || {}).value || '';
      acctStep({name: window._acct.name, type: window._acct.type, state: window._acct.state, result: v, password: window._acct.pw}); break; }
    case 'a-cancel': closeSheet(); await api('account/cancel', {name: d.n}).catch(() => {}); load(); break;
    case 'make-main':
      if (S.settings.plans.length && !confirm('Changing the main account removes your current sync plans. Continue?')) return;
      try { await saveSettings({...S.settings, main: d.n, plans: []}); } catch (er) { toast(er.message); } break;
    case 'del-acct':
      if (!confirm(`Disconnect “${d.n}” from CloudMirror? Files in that account are not touched. Sync plans that use it are updated.`)) return;
      try { await api('account/delete', {name: d.n}); await load(); } catch (er) { toast(er.message); } break;
    case 'new-plan': openPlanEditor(''); break;
    case 'edit-plan': openPlanEditor(d.id); break;
    case 'del-plan':
      if (!confirm('Remove this sync plan? Files already copied stay where they are.')) return;
      try { await saveSettings({...S.settings, plans: S.settings.plans.filter(p => p.id !== d.id)}); } catch (er) { toast(er.message); } break;
    case 'run': run(d.k, d.id ? [d.id] : []); break;
    case 'apply': run('sync', [...new Set(S.job.pairs.map(p => p.planId))]); break;
    case 'stop': api('cancel', {}); break;
    case 'dismiss': hiddenJob = S.job.started; render(); break;
    case 'w-close': closeSheet(); W = null; break;
    case 'w-next': if (TR && TR.sel) { W.source = TR.sel; showDestinations(); } break;
    case 'w-back': showSource(); break;
    case 'w-save': savePlan(); break;
    case 'd-browse': browseDest(d.r); break;
    case 'd-cancel': showDestinations(); break;
    case 'd-use': if (TR && TR.sel) { W.targets[TR.remote].path = TR.sel; showDestinations(); } break;
    case 't-select': treeSelect(d.p); break;
    case 't-toggle': treeToggle(d.p); break;
    case 't-size': wantSize(TR.remote, d.p); renderTree(); break;
    case 't-newopen':
      $('#newrow').innerHTML = `<div class="newrow"><input type="text" id="newname" placeholder="${TR.sel ? 'New folder inside ' + esc(TR.sel) : 'New folder name'}" spellcheck="false"><button class="btn small primary" data-act="t-newadd">Create</button></div>`;
      $('#newname').focus(); $('#newname').onkeydown = ev => { if (ev.key === 'Enter') treeNew(); }; break;
    case 't-newadd': treeNew(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'dm') { saveSettings({...S.settings, deleteMode: t.value}).catch(er => { toast(er.message); render(); }); return; }
  if (t.name === 'gd') { saveSettings({...S.settings, gdocs: t.value}).catch(er => { toast(er.message); render(); }); return; }
  if (t.name === 'upd') { saveSettings({...S.settings, noUpdateCheck: !t.checked}).then(checkUpdate).catch(er => { toast(er.message); render(); }); return; }
  if (t.dataset.chg === 'trash-days') { TRASH.days = +t.value; scanTrash(); return; }
  if (t.dataset.chg === 'd-toggle') {
    const x = W.targets[t.dataset.r]; x.on = t.checked; if (x.on && !x.path) x.path = W.source; showDestinations(); return;
  }
  if (t.dataset.chg === 'more' && t.value) { pickProv(t.value); return; }
  if (t.classList.contains('pin')) { const x = W.targets[t.dataset.r]; x.path = cleanPath(t.value); t.value = x.path; updateDestInfo(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'exclude') W.exclude = t.value;
  if (t.classList && t.classList.contains('pin')) W.targets[t.dataset.r].path = t.value;
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const b = $('#modal [data-act="d-cancel"], #modal [data-act="a-cancel"], #modal [data-act="w-close"]'); if (b) b.click();
});

load().catch(e => { $('#root').innerHTML = `<div class="hero"><h1>Something went wrong</h1><div class="err">${esc(e.message)}</div></div>`; });
</script>
</body>
</html>
