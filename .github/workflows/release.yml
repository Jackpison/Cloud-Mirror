name: Release

# Publishes CloudMirror.exe when a version tag such as v0.1.0 is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Embed icon, version info and manifest
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          "$(go env GOPATH)/bin/go-winres" make --in winres/winres.json --out rsrc --arch amd64 \
            --product-version "${{ steps.v.outputs.version }}" --file-version "${{ steps.v.outputs.version }}"
      - name: Build CloudMirror.exe
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-H=windowsgui -s -w -X main.version=${{ steps.v.outputs.version }}" -o CloudMirror.exe .
          sha256sum CloudMirror.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: CloudMirror.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" CloudMirror.exe SHA256SUMS.txt \
            --title "CloudMirror ${GITHUB_REF_NAME}" --generate-notes
